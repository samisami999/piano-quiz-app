<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8ede0"/>
      <stop offset="100%" stop-color="#e9dac7"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8855b"/>
      <stop offset="100%" stop-color="#b95836"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#5b442c" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- 背景ベース -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- 内側カード -->
  <rect x="36" y="36" width="440" height="440" rx="90" fill="#faf5ec" filter="url(#dropShadow)"/>

  <!-- ピアノ鍵盤ベース -->
  <g transform="translate(68, 140)">
    <!-- 白鍵 -->
    <rect x="0" y="0" width="50" height="210" rx="10" fill="#ffffff" stroke="#d9cbb0" stroke-width="4"/>
    <rect x="54" y="0" width="50" height="210" rx="10" fill="#ffffff" stroke="#d9cbb0" stroke-width="4"/>
    <rect x="108" y="0" width="50" height="210" rx="10" fill="#ffffff" stroke="#d9cbb0" stroke-width="4"/>
    <rect x="162" y="0" width="50" height="210" rx="10" fill="#ffffff" stroke="#d9cbb0" stroke-width="4"/>
    <rect x="216" y="0" width="50" height="210" rx="10" fill="#ffffff" stroke="#d9cbb0" stroke-width="4"/>
    <rect x="270" y="0" width="50" height="210" rx="10" fill="#ffffff" stroke="#d9cbb0" stroke-width="4"/>
    <rect x="324" y="0" width="50" height="210" rx="10" fill="#ffffff" stroke="#d9cbb0" stroke-width="4"/>

    <!-- 黒鍵 -->
    <rect x="34" y="0" width="34" height="125" rx="7" fill="#3a362d"/>
    <rect x="88" y="0" width="34" height="125" rx="7" fill="#3a362d"/>
    <rect x="196" y="0" width="34" height="125" rx="7" fill="#3a362d"/>
    <rect x="250" y="0" width="34" height="125" rx="7" fill="url(#accentGrad)"/>
    <rect x="304" y="0" width="34" height="125" rx="7" fill="#3a362d"/>
  </g>

  <!-- 音符アクセント -->
  <circle cx="256" cy="92" r="16" fill="#e07a4f"/>
  <circle cx="296" cy="80" r="16" fill="#4f8c70"/>
</svg>
