<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- より鮮やかでエネルギーのあるビビッドなサンセットグラデーション -->
    <linearGradient id="vividGrad" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#e62e2e"/>
      <stop offset="35%" stop-color="#f2552c"/>
      <stop offset="70%" stop-color="#ff8426"/>
      <stop offset="100%" stop-color="#ffb834"/>
    </linearGradient>
  </defs>

  <!-- 全面グラデーション背景（Pixelの丸型マスクに完全適合） -->
  <rect width="512" height="512" fill="url(#vividGrad)"/>

  <!-- Pixelの円形切り抜き（セーフゾーン）の中央に完璧に収まるシンメトリー鍵盤シンボル -->
  <g transform="translate(256, 256)">
    <!-- 鍵盤外枠（純白の極太角丸スクエア） -->
    <rect x="-124" y="-124" width="248" height="248" rx="58" fill="none" stroke="#ffffff" stroke-width="26"/>

    <!-- 2本の黒鍵（左右対称の純白ピル） -->
    <rect x="-62" y="-112" width="26" height="114" rx="13" fill="#ffffff"/>
    <rect x="36" y="-112" width="26" height="114" rx="13" fill="#ffffff"/>
  </g>
</svg>
